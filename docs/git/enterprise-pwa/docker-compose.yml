services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:app@postgres:5432/app?serverVersion=17
      REDIS_DSN: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://app:app@rabbitmq:5672/%2f/messages
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "4000:4000"

volumes:
  postgres_data:
