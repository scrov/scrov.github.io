apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-pwa-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: enterprise-pwa-web
  template:
    metadata:
      labels:
        app: enterprise-pwa-web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-pwa-web
spec:
  selector:
    app: enterprise-pwa-web
  ports:
    - port: 4000
      targetPort: 4000
